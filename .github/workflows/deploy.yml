name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # apt is the expensive half of both install steps below: this step runs
      # `apt-get update`, and `playwright install --with-deps` runs it again —
      # Playwright pushes "apt-get update" unconditionally (coreBundle.js), with
      # no flag to skip it. Run 34324369010 measures the first update at 10.4s of
      # the step's 14.0s, so the index cache is where the win is; the archives
      # glob lets `apt-get install` reuse the .debs.
      #
      # The paths are globs, NOT the two directories, on purpose. A bare
      # /var/lib/apt/lists made the post-job save fail the whole upload with
      # exit code 2 — `partial/` and `lock` are root-only, so
      #     tar: ../../../../../var/lib/apt/lists/partial: Cannot open: Permission denied
      # and actions/cache aborts the tar instead of skipping those entries. The
      # globs below select only the index data; lock/partial are apt internals it
      # recreates on demand. apt compares each cached index against the freshly
      # fetched one and redownloads on a version mismatch, so a stale entry
      # self-heals rather than pinning an old package.
      - name: Cache apt lists and archives
        uses: actions/cache@v4
        with:
          path: |
            /var/lib/apt/lists/*.lz4
            /var/lib/apt/lists/*Release*
            /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}
      - name: Install font subset tooling
        run: python3 -m pip install 'fonttools[woff]==4.63.0'
      # og-images.mjs rasterizes Chinese post titles through libvips/fontconfig,
      # which needs a CJK face on the runner or the cards come out as tofu.
      - name: Install CJK font for OG cards
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-droid-fallback
      - name: Verify generated assets
        run: npm run check:generated
      - name: Type-check Astro project
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Verify font subsets
        run: npm run check:fonts
      # Playwright's docs advise against caching browser binaries ("the amount of
      # time it takes to restore the cache is comparable to the time it takes to
      # download"), but that guidance does not hold on hosted runners: run
      # 34324369010 restores 281.9 MB in 2.0s while the download it replaces cost
      # 16.4s, and `Setup Playwright chromium` drops 18.0s → 7.0s — about 9s net.
      # Keep it; the steady-state cost is only the 2.0s restore, since a cache
      # already present for the key means no 281.9 MB upload at job end.
      # Keyed on package-lock.json, which pins @playwright/test and therefore the
      # browser revision Playwright looks for here; a wrong key is harmless,
      # Playwright validates the installed browser against its expected revision
      # hash and re-downloads on mismatch.
      - name: Cache Playwright chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Setup Playwright chromium
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests against the build
        run: npx playwright test
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Submit URLs to IndexNow
        if: github.event_name != 'pull_request'
        run: node scripts/indexnow.mjs || true
      # No-ops with a clear message until BAIDU_PUSH_TOKEN is added as a repo
      # secret (ziyuan.baidu.com → 站点管理 → 普通收录 → API 提交).
      - name: Submit URLs to Baidu
        if: github.event_name != 'pull_request'
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: node scripts/baidu-push.mjs || true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
