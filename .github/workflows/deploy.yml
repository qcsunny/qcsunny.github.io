name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # og-images.mjs rasterizes Chinese post titles through libvips/fontconfig,
      # which needs a CJK face on the runner or the cards come out as tofu.
      - name: Install CJK font for OG cards
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-droid-fallback
      - name: Verify generated assets
        run: npm run check:generated
      - name: Type-check Astro project
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Verify font subsets
        run: npm run check:fonts
      - name: Setup Playwright chromium
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests against the build
        run: npx playwright test
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Submit URLs to IndexNow
        if: github.event_name != 'pull_request'
        run: node scripts/indexnow.mjs || true
      # No-ops with a clear message until BAIDU_PUSH_TOKEN is added as a repo
      # secret (ziyuan.baidu.com → 站点管理 → 普通收录 → API 提交).
      - name: Submit URLs to Baidu
        if: github.event_name != 'pull_request'
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: node scripts/baidu-push.mjs || true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
