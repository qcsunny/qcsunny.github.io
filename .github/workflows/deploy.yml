name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # The gate below asks the Checks API whether the PR head's build job was green;
  # an unlisted scope is granted as `none` and the call returns 403, which the
  # gate treats as "unreadable" and fails closed by running the suite anyway.
  checks: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the skip detection below needs the merge commit's second
      # parent (the PR head), which a shallow clone's first-parent chain omits.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A merge commit's second parent is the PR branch head. When the merge
      # commit's tree is identical to that parent, the full E2E suite already
      # gated exactly this content on the PR — rerunning it on main duplicates
      # ~7 minutes for byte-identical code. Concurrent merges, conflict
      # resolutions, squashes and direct pushes produce a different tree (or no
      # second parent at all) and keep the full run.
      # CRITICAL: this skip may ONLY fire on push-to-main runs. A pull_request
      # run also checks out a merge commit with a second parent, and a PR based
      # on fresh main has merge tree == head tree — the PR-side gate would skip
      # itself, and the post-merge main run would skip too, shipping the PR with
      # zero E2E coverage (caught on PR #38, whose suite was silently skipped).
      - name: Detect already-gated merge (same tree as PR head)
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "PR run — this IS the gate, always running the full suite."
          elif PR_HEAD=$(git rev-parse --verify HEAD^2 2>/dev/null); then
            if git diff --quiet "$PR_HEAD" HEAD; then
              # A matching tree says the PR job ran against this exact content, but
              # that job's conclusion is not visible from here. PR #60's head built
              # red (build: FAILURE, run 34933387261) and its merge still skipped
              # E2E — deploy only failed to ship because `deploy` needs `build`, so
              # the red side was hidden by that dependency and the skip side never
              # checked. Ask the Checks API for the PR head's job instead.
              # Check-runs are keyed on the PR head sha, not the merge sha, and the
              # job check-run is the only github-actions entry named `build` (the
              # other is cloudflare-workers-and-pages) — its conclusion covers the
              # whole job, including the E2E step. Every pull_request run executes
              # the suite, since that branch sets no skip, so green means it ran.
              # Fail closed twice over: `curl -fsS` exits non-zero on 403, 404 or a
              # network error, and all() is true over an empty array, so a missing
              # or unreadable record makes the test false and the suite runs.
              if curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD}/check-runs?per_page=100" \
                | jq -e '([.check_runs[]? | select(.app.slug == "github-actions" and .name == "build")] | (length > 0) and all(.conclusion == "success"))'; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "Tree identical to PR head $PR_HEAD and its build job is green — E2E gated there already, skipping the duplicate run."
              else
                echo "Tree matches PR head $PR_HEAD but its build job is not green (or unreadable) — running the full suite."
              fi
            else
              echo "Merge changed the tree (concurrent merge or conflict resolution) — running the full suite."
            fi
          else
            echo "No second parent (direct push, squash or rebase merge) — running the full suite."
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # NOTE: do not cache apt here. /var/lib/apt/lists and /var/cache/apt/archives
      # are root-owned; actions/cache runs as the non-root `runner` user, so it
      # can read them into a tarball on save but cannot write them back on
      # restore. `tar -xf` exits 2 ("Cannot open: File exists" on the runner's
      # pre-existing indexes, "Permission denied" on the root-owned .debs) and
      # actions/cache reports every restore as a miss (run 34325886955), leaving a
      # 23.5 MB dead-weight blob. The Playwright cache below pays because its
      # path ~/.cache/ms-playwright is user-writable; apt's system paths are not.
      - name: Install font subset tooling
        run: python3 -m pip install 'fonttools[woff]==4.63.0'
      # og-images.mjs rasterizes Chinese post titles through libvips/fontconfig,
      # which needs a CJK face on the runner or the cards come out as tofu.
      - name: Install CJK font for OG cards
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-droid-fallback
      - name: Verify generated assets
        run: npm run check:generated
      - name: Type-check Astro project
        run: npm run check
      # Setup Playwright chromium before build so diagrams can be compiled to SVG in the cloud
      - name: Cache Playwright chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Setup Playwright chromium
        run: npx playwright install chromium --with-deps
      - name: Build site
        run: npm run build
      - name: Verify font subsets
        run: npm run check:fonts
      - name: Run E2E tests against the build
        if: steps.gate.outputs.skip != 'true'
        run: npx playwright test
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Submit URLs to IndexNow
        if: github.event_name != 'pull_request'
        run: node scripts/indexnow.mjs || true
      # No-ops with a clear message until BAIDU_PUSH_TOKEN is added as a repo
      # secret (ziyuan.baidu.com → 站点管理 → 普通收录 → API 提交).
      - name: Submit URLs to Baidu
        if: github.event_name != 'pull_request'
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: node scripts/baidu-push.mjs || true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
