name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the skip detection below needs the merge commit's second
      # parent (the PR head), which a shallow clone's first-parent chain omits.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A merge commit's second parent is the PR branch head, and when the merge
      # commit's tree is identical to that parent this run is byte-identical to
      # content the PR run already gated — so a skip here would save the suite's
      # ~1.5 minutes. That skip is deliberately absent.
      #
      # The proof that the PR run was green lives in its `build` check-run, and
      # the Checks API refuses GITHUB_TOKEN on this repo even with `checks: read`
      # declared and granted: run 34993729578 came back `curl: (22) 401` while
      # `contents: read` (checkout, `git diff`) and `pages: write` (artifact
      # upload) both succeeded in the same job. Tree identity is not greenness,
      # so the suite always runs. Skipping on tree identity alone is what let
      # PR #60's red head ship with zero E2E coverage, and PR #38's suite was
      # skipped the same way. This step only reports which of the three cases we
      # are in, so a future log still shows whether the trees matched — and
      # anyone re-adding a skip sees why the greenness proof is unobtainable.
      - name: Report what this run looks like
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "PR run — this IS the gate, running the full suite."
          elif PR_HEAD=$(git rev-parse --verify HEAD^2 2>/dev/null); then
            if git diff --quiet "$PR_HEAD" HEAD; then
              echo "Merge tree identical to PR head $PR_HEAD — the PR run gated this same content, but its conclusion is not readable from here (see above), so running the full suite."
            else
              echo "Merge changed the tree (concurrent merge or conflict resolution) — running the full suite."
            fi
          else
            echo "No second parent (direct push, squash or rebase merge) — running the full suite."
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # NOTE: do not cache apt here. /var/lib/apt/lists and /var/cache/apt/archives
      # are root-owned; actions/cache runs as the non-root `runner` user, so it
      # can read them into a tarball on save but cannot write them back on
      # restore. `tar -xf` exits 2 ("Cannot open: File exists" on the runner's
      # pre-existing indexes, "Permission denied" on the root-owned .debs) and
      # actions/cache reports every restore as a miss (run 34325886955), leaving a
      # 23.5 MB dead-weight blob. The Playwright cache below pays because its
      # path ~/.cache/ms-playwright is user-writable; apt's system paths are not.
      - name: Install font subset tooling
        run: python3 -m pip install 'fonttools[woff]==4.63.0'
      # og-images.mjs rasterizes Chinese post titles through libvips/fontconfig,
      # which needs a CJK face on the runner or the cards come out as tofu.
      - name: Install CJK font for OG cards
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-droid-fallback
      - name: Verify generated assets
        run: npm run check:generated
      - name: Type-check Astro project
        run: npm run check
      # Setup Playwright chromium before build so diagrams can be compiled to SVG in the cloud
      - name: Cache Playwright chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Setup Playwright chromium
        run: npx playwright install chromium --with-deps
      - name: Build site
        run: npm run build
      - name: Verify font subsets
        run: npm run check:fonts
      - name: Run E2E tests against the build
        run: npx playwright test
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Submit URLs to IndexNow
        if: github.event_name != 'pull_request'
        run: node scripts/indexnow.mjs || true
      # No-ops with a clear message until BAIDU_PUSH_TOKEN is added as a repo
      # secret (ziyuan.baidu.com → 站点管理 → 普通收录 → API 提交).
      - name: Submit URLs to Baidu
        if: github.event_name != 'pull_request'
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: node scripts/baidu-push.mjs || true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
